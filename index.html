<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옥외광고물 인허가 안내 | 진건·퇴계원행정복지센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 색상·기본값 (화이트 디자인) — 여기 값만 바꾸면 전체 색이 바뀝니다
   ========================================================= */
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --soft:#f2f4f9;
  --line:#e4e7ef;
  --text:#1b1e2b;
  --muted:#6b7186;
  --blue:#3f6ef5;
  --purple:#7b5cf0;
  --grad:linear-gradient(135deg,#3f6ef5 0%,#7b5cf0 100%);
  --blue-soft:#eef3ff;
  --purple-soft:#f3efff;
  --ok:#14a36b;  --ok-soft:#e9f8f1;
  --warn:#b26a00; --warn-soft:#fff6e6;
  --radius:18px;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* 2. 머리글 */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:15px;color:#fff}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.2}
.top-call{font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 14px;border-radius:999px;background:#fff}
.top-call b{color:var(--blue)}
main{flex:1;padding:36px 0 60px}

/* 3. 첫 화면 */
.hero{text-align:center;padding:30px 0 34px}
.chip{display:inline-block;font-size:13px;padding:5px 14px;border-radius:999px;color:var(--purple);background:var(--purple-soft);margin-bottom:16px;font-weight:500}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:900;line-height:1.25;letter-spacing:-.5px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:12px}
.search{max-width:560px;margin:26px auto 0;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;border-radius:16px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit}
.search input::placeholder{color:#a3a8b8}
.search button{border:0;border-radius:12px;padding:11px 20px;background:var(--grad);color:#fff;font-weight:700}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;margin-bottom:22px;background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft));border-color:#dfe3fb}
.cta h2{font-size:19px}
.cta p{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{padding:22px;text-align:left;color:var(--text);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#c7d3fb;box-shadow:0 10px 28px rgba(63,110,245,.12)}
.card .no{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:1px}
.card .ico{font-size:28px;margin:10px 0 8px}
.card h3{font-size:17px;margin-bottom:4px}
.card p{font-size:13.5px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}

/* 4. 영역 화면 공통 */
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px;margin-bottom:22px}
.steps button{flex:1 0 auto;min-width:96px;border:0;background:none;color:var(--muted);padding:10px 8px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.steps button .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:700;font-size:12px;background:#fff}
.steps button.done .dot{background:var(--blue-soft);border-color:#c7d3fb;color:var(--blue)}
.steps button.on{background:var(--soft);color:var(--text);font-weight:700}
.steps button.on .dot{background:var(--grad);border:0;color:#fff}
.home-btn{background:#fff;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;margin-bottom:14px}
.panel{padding:30px}
.panel h2{font-size:24px;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:22px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 20px;border-radius:12px;font-weight:500}
.btn.primary{background:var(--grad);border:0;color:#fff;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.check{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid #f5d9a8;padding:1px 8px;border-radius:999px;vertical-align:middle}
.law{font-size:12.5px;color:#8a90a3;margin-top:8px}
.note{padding:14px 18px;border-radius:12px;background:var(--blue-soft);border:1px solid #d6e0fd;font-size:14px;color:#2c4aa8;margin-top:16px}
.note.warn{background:var(--warn-soft);border-color:#f5d9a8;color:#8a5200}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.p{background:var(--purple-soft);color:var(--purple)}
.tag.s{background:var(--blue-soft);color:var(--blue)}
.tag.x{background:var(--ok-soft);color:var(--ok)}

/* 5. 자가진단 */
.wiz-bar{height:6px;border-radius:99px;background:#e9ecf3;overflow:hidden;margin-bottom:8px}
.wiz-bar i{display:block;height:100%;background:var(--grad);transition:.35s}
.wiz-label{font-size:13px;color:var(--muted);margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opt{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);transition:.15s}
.opt:hover{border-color:#b9c8f8;background:#fafbff}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.opt b{display:block;font-size:15px}
.opt span{font-size:12.5px;color:var(--muted)}
.q{margin-bottom:20px}
.q > p{font-weight:700;margin-bottom:10px}
.yn{display:flex;gap:10px;flex-wrap:wrap}
.yn .opt{flex:1;min-width:120px;text-align:center}
.result{padding:26px;border-radius:16px;text-align:center;margin-bottom:16px;border:1px solid var(--line)}
.result .big{font-size:30px;font-weight:900;margin:6px 0}
.result.p{background:var(--purple-soft);border-color:#d9cffb}.result.p .big{color:var(--purple)}
.result.s{background:var(--blue-soft);border-color:#d6e0fd}.result.s .big{color:var(--blue)}
.result.x{background:var(--ok-soft);border-color:#bfe9d6}.result.x .big{color:var(--ok)}
.result.c{background:var(--warn-soft);border-color:#f5d9a8}.result.c .big{color:var(--warn)}
.result ul{text-align:left;margin:14px auto 0;max-width:560px;color:var(--muted);font-size:14px;padding-left:18px}

/* 6. 기준·서류·절차·FAQ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.std{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.std .box{padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff}
.std .box h4{font-size:14px;margin-bottom:8px}
.std .box ul{padding-left:18px;font-size:14px;color:var(--muted)}
.std .box.full{grid-column:1/-1;background:var(--soft)}
.cl{list-style:none;display:grid;gap:10px}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.cl input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex-shrink:0}
.cl label:has(input:checked){border-color:#bfe9d6;background:var(--ok-soft)}
.cl small{display:block;color:var(--muted);font-size:12.5px}
.meter{display:flex;align-items:center;gap:12px;margin:4px 0 16px;font-size:14px;color:var(--muted)}
.meter .wiz-bar{flex:1;margin:0}
.flow{list-style:none;position:relative;padding-left:44px}
.flow::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--purple));opacity:.35}
.flow li{position:relative;margin-bottom:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:#fff}
.flow li::before{content:attr(data-n);position:absolute;left:-44px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
.flow h4{font-size:15.5px}
.flow p{font-size:14px;color:var(--muted)}
.faq details{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.faq summary{list-style:none;padding:16px 18px;font-weight:700;cursor:pointer;display:flex;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q";color:var(--purple);font-weight:900}
.faq details[open] summary{background:var(--soft)}
.faq .a{padding:12px 18px 18px 40px;color:var(--muted);font-size:14.5px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact .box{padding:22px;border-radius:14px;border:1px solid var(--line);background:#fff}
.contact .box small{color:var(--muted);font-size:13px}
.contact .box .v{font-size:20px;font-weight:700;margin-top:4px}
.copy{margin-top:10px;font-size:13px;padding:7px 14px}

/* 8. 계산기·바로가기·접근성 */
.h3{font-size:17px;margin:26px 0 10px}
.h3 small{font-size:13px;color:var(--muted);font-weight:400}
.calc{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}
.calc-in{display:grid;gap:12px;align-content:start}
.fld{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.fld select,.fld input{font:inherit;font-size:15px;color:var(--text);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 10px;border-radius:10px;font-size:13.5px}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.tg{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.tg input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.tg small{color:var(--muted);font-size:12px}
.calc-out{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.calc-out .lbl{font-size:13px;color:var(--muted)}
.calc-out .sum{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.calc-out ul{list-style:none;font-size:13.5px;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.calc-out li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.calc-out li b{color:var(--text);white-space:nowrap}
.calc-out small{font-size:12px;color:#8a90a3;margin-top:auto}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.qk{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-decoration:none;color:var(--text);text-align:left;font-size:15px}
.qk span{font-size:13px;color:var(--muted)}
.qk:hover{border-color:#c7d3fb}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lk{display:flex;flex-direction:column;padding:13px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);background:#fff;font-size:14.5px}
.lk span{font-size:12.5px;color:var(--muted)}
.lk:hover{border-color:#c7d3fb;background:#fafbff}
:focus-visible{outline:3px solid rgba(63,110,245,.45);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{left:12px}
@media (max-width:720px){.calc,.quick,.links{grid-template-columns:1fr}}

/* 7. 푸터 — 카피라이트 고정 */
footer{border-top:1px solid var(--line);background:#fff;padding:26px 0;text-align:center;font-size:13px;color:var(--muted)}
footer .upd{font-size:12px;color:#9aa0b2;margin-top:6px}
@media (max-width:720px){
  .std,.contact{grid-template-columns:1fr}
  .panel{padding:22px 18px}
  .cta{flex-direction:column;align-items:flex-start}
  .top-call span{display:none}
}
</style>
</head>

<script>
/* =========================================================
   [수정 안내] 아래 '설정값'만 고치면 화면 내용이 바뀝니다.
   - 전화번호, 부서명: CONTACT
   - 처리기간: PERIOD / 공식 링크: LINKS
   - 수수료: FEE_RULES(허가·신고, 조례 별표3), SAFETY_RULES(안전점검, 조례 별표4)
   ========================================================= */
const CONTACT = {
  office: "남양주시 진건·퇴계원행정복지센터",
  dept: "도시건축과 건축팀",
  tel: "031-590-5859",
  hours: "평일 09:00 ~ 18:00 (점심시간 12:00 ~ 13:00)",   // 운영시간 확인 후 수정
  area: "진건읍 관할"
};

const PERIOD = {   // 남양주시 민원편람(법정처리기간)
  permit: "7일",
  report: "3일",
  review: "20일 이내"  // 옥외광고심의위원회 심의 대상 (법 제3조제9항)
};
const LINKS = {   // 공식 바로가기 (외부 링크)
  forms: "https://www.nyj.go.kr/www/selectBbsNttView.do?bbsNo=11&key=2286&nttNo=327070",
  gov24: "https://www.gov.kr/mw/AA020InfoCappView.do?HighCtgCD=A09006&CappBizCD=13100000152&tp_seq=01",
  law: "https://law.go.kr/lsInfoP.do?lsId=001020&urlMode=lsInfoP",
  decree: "https://www.law.go.kr/LSW/lsInfoP.do?lsId=004242",
  gg: "https://law.go.kr/LSW/ordinInfoP.do?ordinSeq=2178549",
  nyj: "https://www.law.go.kr/ordinInfoP.do?ordinSeq=2099101",
  easylaw: "https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=897&ccfNo=3&cciNo=1&cnpClsNo=1",
  banner: "https://www.nyj.go.kr/www/selectBbsNttView.do?bbsNo=35&key=2406&nttNo=499034",
  zone: "https://www.nyj.go.kr/www/selectBbsNttView.do?bbsNo=35&key=2406&nttNo=499044",
  popsign: "http://www.popsign.co.kr/"
};

/* 「남양주시 옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 조례」 [별표 3] 광고물등의 허가·신고 수수료
   mode: area(면적 기준) / count(개수·매수·건수 기준)
   base(기본금액), upTo(기본면적 ㎡), add(초과 1㎡당 가산액), sides(양면 선택 가능) */
const FEE_RULES = [
  {k:"wallH",  g:"벽면 이용 간판", n:"가로형 간판(자사광고)", mode:"area", base:3000,  upTo:6,  add:1000, safety:"wall"},
  {k:"wallHo", g:"벽면 이용 간판", n:"가로형 간판(타사광고)", mode:"area", base:30000, upTo:6,  add:2000, safety:"wall"},
  {k:"wallV",  g:"벽면 이용 간판", n:"세로형 간판(자사광고)", mode:"area", base:2000,  upTo:6,  add:1000, safety:"wall"},
  {k:"wallVo", g:"벽면 이용 간판", n:"세로형 간판(타사광고)", mode:"area", base:30000, upTo:6,  add:2000, safety:"wall"},
  {k:"proj",   g:"돌출간판", n:"돌출간판", mode:"area", base:15000, upTo:6, add:1000, sides:true, safety:"proj"},
  {k:"projS",  g:"돌출간판", n:"이·미용업소 표지등, 의료기관·약국 표지등", mode:"count", unit:"개", base:4000},
  {k:"show",   g:"공연간판", n:"공연간판(벽면 이용 가로형 간판과 같음)", mode:"area", base:3000, upTo:6, add:1000},
  {k:"roof",   g:"옥상간판", n:"옥상간판", mode:"area", base:35000, upTo:10, add:5000, safety:"roof"},
  {k:"pole",   g:"지주 이용 간판", n:"지주 이용 간판", mode:"area", base:15000, upTo:10, add:2000, sides:true, safety:"pole"},
  {k:"balloon",g:"애드벌룬", n:"공중에 띄우는 애드벌룬", mode:"count", unit:"개", base:15000},
  {k:"public", g:"공공시설물 이용 광고물", n:"공공시설물 이용 광고물", mode:"area", base:3000, upTo:1, add:1000},

const TYPES = [

const QUESTIONS = {
  wall:[
    {k:"len10", t:"간판의 가로 또는 세로 중 한 변의 길이가 10m 이상입니까?"},
    {k:"floor4",t:"건물의 4층 이상 층에 표시합니까?"},

    {k:"area5", t:"간판 면적이 5㎡ 이상입니까?"},
    {k:"door",  t:"건물 출입구 양옆에 세로로 표시하는 간판입니까?", if:a=>a.area5},
    {k:"neon",  t:"네온류·전광류 또는 디지털 디스플레이를 사용합니까?"}

  proj:[
    {k:"sign", t:"의료기관·약국 표지등(＋, 약) 또는 이용업소·미용업소 표지등입니까?"},
    {k:"h5",   t:"간판 윗부분까지의 높이가 지면으로부터 5m 이상입니까?", if:a=>!a.sign},
    {k:"a1",   t:"간판 한 면의 면적이 1㎡ 이상입니까?", if:a=>!a.sign}
  ],
  pole:[{k:"h4", t:"간판 윗부분까지의 높이가 지면으로부터 4m 이상입니까?"}],
  show:[{k:"first", t:"처음으로 표시하는 공연간판입니까?"}],
  banner:[{k:"fac30", t:"현수막을 걸기 위한 게시시설(틀)을 새로 설치하고, 그 면적이 30㎡를 초과합니까?"}]
};

function judge(t,a){
  const P={c:"p",big:"허가 대상",msg:"허가를 받은 뒤 설치해야 합니다."};
  const S={c:"s",big:"신고 대상",msg:"신고를 마친 뒤 설치해야 합니다."};
  switch(t){
    case "wall":
      if(a.len10) return {...P, why:"한 변의 길이가 10m 이상인 벽면 이용 간판", law:"시행령 제4조"};
      if(a.floor4 && a.other) return {...P, why:"4층 이상 층에 표시하는 타사광고 벽면 이용 간판", law:"시행령 제4조"};
      if(a.floor4) return {...S, why:"건물 4층 이상 층에 표시하는 벽면 이용 간판", law:"시행령 제5조제1항제1호"};
      if(a.area5 && !a.door) return {...S, why:"면적 5㎡ 이상인 벽면 이용 간판", law:"시행령 제5조제1항제1호"};
      if(a.neon) return {c:"c",big:"확인 필요",msg:"네온류·전광류·디지털 디스플레이를 사용하는 간판은 크기가 작아도 허가·신고 대상일 수 있습니다.",why:"조명·디지털 광고물 사용",law:"담당 부서 확인"};
      return {c:"x",big:"허가·신고 제외",msg:"허가·신고 없이 표시할 수 있으나, 표시방법(위치·크기·수량 등)은 지켜야 합니다.",why:"3층 이하에 표시하는 면적 5㎡ 미만 간판(또는 출입구 양옆 세로 간판)",law:"시행령 제5조제1항제1호 반대해석"};
    case "proj":
      if(a.sign) return {...S, why:"의료기관·약국 또는 이용·미용업소 표지등", law:"시행령 제5조제1항제4호"};
      if(a.h5 && a.a1) return {...P, why:"높이 5m 이상이고 한 면 면적 1㎡ 이상인 돌출간판", law:"시행령 제4조제1항제2호"};
      return {...S, why:a.h5?"한 면의 면적이 1㎡ 미만인 돌출간판":"윗부분 높이가 5m 미만인 돌출간판", law:"시행령 제5조제1항제4호"};
    case "pole": return a.h4 ? {...P, why:"높이 4m 이상인 지주 이용 간판", law:"시행령 제4조"} : {...S, why:"높이 4m 미만인 지주 이용 간판", law:"시행령 제5조제1항제5호"};
    case "roof": return {...P, why:"모든 옥상간판", law:"시행령 제4조"};
    case "stand":return {...S, why:"모든 입간판", law:"시행령 제5조제1항제5호의2"};
    case "banner":return a.fac30 ? {...P, why:"면적 30㎡를 초과하는 현수막 게시시설", law:"시행령 제5조제2항 단서"} : {...S, why:"현수막(가로등 현수기 포함)", law:"시행령 제5조제1항제6호"};
    case "show": return a.first ? {...P, why:"최초로 표시하는 공연간판", law:"시행령 제4조"} : {...S, why:"최초 표시가 아닌 공연간판", law:"시행령 제5조제1항제3호"};
    case "balloon":return {...P, why:"모든 애드벌룬", law:"시행령 제4조"};
    case "paper":return {...S, why:"벽보·전단", law:"시행령 제5조"};
    default: return {c:"c",big:"확인 필요",msg:"창문 이용 광고물, 디지털 광고물 등은 형태에 따라 기준이 달라 담당 부서 상담이 필요합니다.",why:"그 밖의 광고물",law:"담당 부서 확인"};
  }
}

}

/* 수수료 계산식 — 남양주시 수수료 계산식(엑셀)과 같은 방식
   초과 면적의 1㎡ 미만 단수는 1㎡로 올리고, 결과는 100원 미만을 버립니다. */
const calc = { k:"wallH", w:"", h:"", sides:1, qty:1, neon:false, kind:"new", safety:false };
function feeOf(rule, area){
  if(rule.mode==="count") return rule.base;
  const over = Math.max(0, area - rule.upTo);
  return rule.base + Math.ceil(over - 1e-9) * rule.add;
}
function safetyOf(key, area){
  const s = SAFETY_RULES[key]; if(!s) return null;
  if(s.min && area < s.min) return {fee:0, note:`면적 ${s.min}㎡ 미만은 안전점검 대상이 아닙니다.`};
  let base;
  if(s.t1!==null && area<=s.t1) base=s.f1;
  else if(area<=s.t2) base=s.f2;
  else base=s.f2 + Math.ceil(area - s.t2 - 1e-9)*s.add;
  return {base, fee: Math.floor(base*1.1/100)*100};
}
function calcResult(){
  const r = FEE_RULES.find(x=>x.k===calc.k);
  const w=parseFloat(calc.w)||0, hh=parseFloat(calc.h)||0;
  const sides = r.sides ? calc.sides : 1;
  const area = Math.round(w*hh*sides*100)/100;
  const qty = Math.max(1, parseInt(calc.qty)||1);
  const needSize = r.mode==="area";
  let lines=[], total=0, ok = !needSize || area>0;
  if(ok){
    let fee = feeOf(r, area) * qty;
    lines.push([`기본 수수료${needSize?` (면적 ${area}㎡)`:""}${qty>1?` × ${qty}${r.qty||r.unit||"개"}`:""}`, fee]);
    if(calc.neon){ lines.push(["네온류·전광류 사용(2배)", fee]); fee*=2; }
    if(calc.kind==="content"){ const half=Math.floor(fee/2/100)*100; lines.push(["광고 내용만 변경(2분의 1)", half-fee]); fee=half; }
    fee = Math.floor(fee/100)*100; total+=fee;
    if(calc.safety && r.safety){
      const s = safetyOf(r.safety, needSize?area:0);
      if(s && s.fee){ lines.push([`안전점검 수수료(별표 4 ${won(s.base)} + 10% 가산)`, s.fee]); total+=s.fee; }
      else if(s) lines.push([s.note, 0]);
    }
  }
  return `<div class="lbl">예상 수수료</div>
    <div class="sum">${ok?won(total):"—"}</div>
    ${ok?`<ul>${lines.map(([t,v])=>`<li><span>${t}</span><b>${v<0?"−"+won(-v):(v?won(v):"")}</b></li>`).join("")}</ul>`:`<p style="font-size:14px;color:var(--muted)">가로·세로 길이(m)를 입력하십시오.</p>`}
    <small>조례 별표 3·4 기준 참고 금액이며, 실제 납부액은 접수 시 산정한 고지 금액에 따릅니다.</small>`;
}
function drawFeeCalc(box){
  const r = FEE_RULES.find(x=>x.k===calc.k);
  const groups = [...new Set(FEE_RULES.map(x=>x.g))];
  const needSize = r.mode==="area";
  box.innerHTML = `
    <div class="calc">
      <div class="calc-in">
        <label class="fld"><span>광고물 종류</span>
          <select id="c-k">${groups.map(g=>`<optgroup label="${g}">${FEE_RULES.filter(x=>x.g===g).map(x=>`<option value="${x.k}" ${x.k===calc.k?"selected":""}>${x.n}</option>`).join("")}</optgroup>`).join("")}</select></label>
        ${needSize?`<div class="row2">
          <label class="fld"><span>가로(m)</span><input id="c-w" type="number" inputmode="decimal" min="0" step="0.01" value="${calc.w}" placeholder="예) 5.8"></label>
          <label class="fld"><span>세로(m)</span><input id="c-h" type="number" inputmode="decimal" min="0" step="0.01" value="${calc.h}" placeholder="예) 1.5"></label></div>`:""}
        ${r.sides?`<div class="fld"><span>표시 면</span><div class="seg">
          <button data-s="1" class="${calc.sides==1?'on':''}">한 면</button><button data-s="2" class="${calc.sides==2?'on':''}">양면</button></div></div>`:""}
        ${(r.mode==="count"||r.qty)?`<label class="fld"><span>수량(${r.qty||r.unit})</span><input id="c-q" type="number" min="1" step="1" value="${calc.qty}"></label>`:""}
        <div class="fld"><span>신청 구분</span><div class="seg">
          <button data-kind="new" class="${calc.kind==='new'?'on':''}">신규·연장·규격 변경</button><button data-kind="content" class="${calc.kind==='content'?'on':''}">광고 내용만 변경</button></div></div>
        <label class="tg"><input type="checkbox" id="c-n" ${calc.neon?"checked":""}> 네온류·전광류 사용 <small>(단순 조명·광원 비노출은 제외, 점멸·동영상은 포함)</small></label>
        ${r.safety?`<label class="tg"><input type="checkbox" id="c-s" ${calc.safety?"checked":""}> 안전점검 대상 광고물 <small>(${SAFETY_RULES[r.safety].target})</small></label>`:""}
      </div>
      <div class="calc-out" id="c-out" aria-live="polite">${calcResult()}</div>
    </div>`;
  const re = ()=>drawFeeCalc(box);
  const out = ()=>{ box.querySelector("#c-out").innerHTML = calcResult(); };
  box.querySelector("#c-k").onchange=e=>{calc.k=e.target.value;calc.safety=false;calc.qty=1;re();};
  [["#c-w","w"],["#c-h","h"],["#c-q","qty"]].forEach(([id,key])=>{const i=box.querySelector(id); if(i) i.oninput=e=>{calc[key]=e.target.value; out();};});
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{calc.sides=+b.dataset.s;re();});
  box.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{calc.kind=b.dataset.kind;re();});
  box.querySelector("#c-n").onchange=e=>{calc.neon=e.target.checked;out();};
  const s=box.querySelector("#c-s"); if(s) s.onchange=e=>{calc.safety=e.target.checked;out();};
}
function feeText(r){
  if(r.mode==="count") return `${r.unit}당 <b>${won(r.base)}</b>`;
  return `${r.upTo}㎡ 이하 <b>${won(r.base)}</b><br><small>초과 시 1㎡마다 ${won(r.add)}</small>`;
}

    <div class="tbl-wrap"><table class="tbl">

      ${Object.values(SAFETY_RULES).map(s=>`<tr><td>${s.n}</td><td>${s.target}</td><td>${s.t1!==null?`${s.t1}㎡ 이하 ${won(s.f1)}<br>${s.t1}㎡ 초과 ${s.t2}㎡ 이하 ${won(s.f2)}`:`${s.min}㎡ 이상 ${s.t2}㎡ 이하 ${won(s.f2)}`}<br>${s.t2}㎡ 초과 시 1㎡마다 ${won(s.add)} 가산</td></tr>`).join("")}
    </table></div>
    <p class="law">근거: 「옥외광고물법」 제17조, 「남양주시 옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 조례」(제2488호, 2025. 12. 29. 시행) 제25조, [별표 3], [별표 4]</p>
    <div class="note warn">· 수수료는 신청서(신고서)를 제출하면서 고지서로 납부합니다.<br>
      · 과오납, 수리 전 신청 변경·철회, 시의 귀책사유 등에는 수수료를 반환합니다. (조례 제25조제2항)<br>
      · 안전점검 수수료는 남양주시 산정 방식에 따라 별표 4 금액에 10%를 가산하여 계산했습니다.<br>
      · 문의: ${CONTACT.tel}</div>`;
  drawFeeCalc(el.querySelector("#calcBox"));
}
