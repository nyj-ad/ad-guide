<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/nyj-ci-symbol.png">
<title>옥외광고물 인허가 안내 | 진건·퇴계원행정복지센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 색상·기본값 (화이트 디자인) — 여기 값만 바꾸면 전체 색이 바뀝니다
   ========================================================= */
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --soft:#f2f4f9;
  --line:#e4e7ef;
  --text:#1b1e2b;
  --muted:#6b7186;
  --blue:#3f6ef5;
  --purple:#7b5cf0;
  --grad:linear-gradient(135deg,#3f6ef5 0%,#7b5cf0 100%);
  --blue-soft:#eef3ff;
  --purple-soft:#f3efff;
  --ok:#14a36b;  --ok-soft:#e9f8f1;
  --warn:#b26a00; --warn-soft:#fff6e6;
  --radius:18px;
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* 2. 머리글 */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700}
.ci{height:26px;width:auto;display:block;flex-shrink:0}
.brand{gap:12px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.2}
.top-call{font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 14px;border-radius:999px;background:#fff}
.top-call b{color:var(--blue)}
main{flex:1;padding:36px 0 60px}

/* 3. 첫 화면 */
.hero{text-align:center;padding:30px 0 34px}
.chip{display:inline-block;font-size:13px;padding:5px 14px;border-radius:999px;color:var(--purple);background:var(--purple-soft);margin-bottom:16px;font-weight:500}
.hero h1{font-size:clamp(28px,5vw,44px);font-weight:900;line-height:1.25;letter-spacing:-.5px}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:12px}
.search{max-width:560px;margin:26px auto 0;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;border-radius:16px}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit}
.search input::placeholder{color:#a3a8b8}
.search button{border:0;border-radius:12px;padding:11px 20px;white-space:nowrap;flex-shrink:0;background:var(--grad);color:#fff;font-weight:700}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;margin-bottom:22px;background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft));border-color:#dfe3fb}
.cta h2{font-size:19px}
.cta p{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{padding:22px;text-align:left;color:var(--text);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#c7d3fb;box-shadow:0 10px 28px rgba(63,110,245,.12)}
.card .no{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:1px}

.card h3{font-size:17px;margin-bottom:4px}
.card p{font-size:13.5px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}

/* 4. 영역 화면 공통 */
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px;margin-bottom:22px}
.steps button{flex:1 0 auto;min-width:96px;border:0;background:none;color:var(--muted);padding:10px 8px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.steps button .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:700;font-size:12px;background:#fff}
.steps button.done .dot{background:var(--blue-soft);border-color:#c7d3fb;color:var(--blue)}
.steps button.on{background:var(--soft);color:var(--text);font-weight:700}
.steps button.on .dot{background:var(--grad);border:0;color:#fff}
.home-btn{background:#fff;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;margin-bottom:14px}
.panel{padding:30px}
.panel h2{font-size:24px;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:22px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 20px;border-radius:12px;font-weight:500}
.btn.primary{background:var(--grad);border:0;color:#fff;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.check{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border:1px solid #f5d9a8;padding:1px 8px;border-radius:999px;vertical-align:middle}
.law{font-size:12.5px;color:#8a90a3;margin-top:8px}
.note{padding:14px 18px;border-radius:12px;background:var(--blue-soft);border:1px solid #d6e0fd;font-size:14px;color:#2c4aa8;margin-top:16px}
.note.warn{background:var(--warn-soft);border-color:#f5d9a8;color:#8a5200}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.p{background:var(--purple-soft);color:var(--purple)}
.tag.s{background:var(--blue-soft);color:var(--blue)}
.tag.x{background:var(--ok-soft);color:var(--ok)}

/* 5. 자가진단 */
.wiz-bar{height:6px;border-radius:99px;background:#e9ecf3;overflow:hidden;margin-bottom:8px}
.wiz-bar i{display:block;height:100%;background:var(--grad);transition:.35s}
.wiz-label{font-size:13px;color:var(--muted);margin-bottom:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opt{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);transition:.15s}
.opt:hover{border-color:#b9c8f8;background:#fafbff}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.opt b{display:block;font-size:15px}
.opt span{font-size:12.5px;color:var(--muted)}
.q{margin-bottom:20px}
.q > p{font-weight:700;margin-bottom:10px}
.yn{display:flex;gap:10px;flex-wrap:wrap}
.yn .opt{flex:1;min-width:120px;text-align:center}
.result{padding:26px;border-radius:16px;text-align:center;margin-bottom:16px;border:1px solid var(--line)}
.result .big{font-size:30px;font-weight:900;margin:6px 0}
.result.p{background:var(--purple-soft);border-color:#d9cffb}.result.p .big{color:var(--purple)}
.result.s{background:var(--blue-soft);border-color:#d6e0fd}.result.s .big{color:var(--blue)}
.result.x{background:var(--ok-soft);border-color:#bfe9d6}.result.x .big{color:var(--ok)}
.result.c{background:var(--warn-soft);border-color:#f5d9a8}.result.c .big{color:var(--warn)}
.result ul{text-align:left;margin:14px auto 0;max-width:560px;color:var(--muted);font-size:14px;padding-left:18px}

/* 6. 기준·서류·절차·FAQ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:14px}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.std{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.std .box{padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff}
.std .box h4{font-size:14px;margin-bottom:8px}
.std .box ul{padding-left:18px;font-size:14px;color:var(--muted)}
.std .box.full{grid-column:1/-1;background:var(--soft)}
.cl{list-style:none;display:grid;gap:10px}
.cl label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.cl input{width:20px;height:20px;margin-top:2px;accent-color:var(--blue);flex-shrink:0}
.cl label:has(input:checked){border-color:#bfe9d6;background:var(--ok-soft)}
.cl small{display:block;color:var(--muted);font-size:12.5px}
.meter{display:flex;align-items:center;gap:12px;margin:4px 0 16px;font-size:14px;color:var(--muted)}
.meter .wiz-bar{flex:1;margin:0}
.flow{list-style:none;position:relative;padding-left:44px}
.flow::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--blue),var(--purple));opacity:.35}
.flow li{position:relative;margin-bottom:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:#fff}
.flow li::before{content:attr(data-n);position:absolute;left:-44px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
.flow h4{font-size:15.5px}
.flow p{font-size:14px;color:var(--muted)}
.faq details{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.faq summary{list-style:none;padding:16px 18px;font-weight:700;cursor:pointer;display:flex;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q";color:var(--purple);font-weight:900}
.faq details[open] summary{background:var(--soft)}
.faq .a{padding:12px 18px 18px 40px;color:var(--muted);font-size:14.5px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact .box{padding:22px;border-radius:14px;border:1px solid var(--line);background:#fff}
.contact .box small{color:var(--muted);font-size:13px}
.contact .box .v{font-size:20px;font-weight:700;margin-top:4px}
.copy{margin-top:10px;font-size:13px;padding:7px 14px}

/* 8. 계산기·바로가기·접근성 */
.h3{font-size:17px;margin:26px 0 10px}
.h3 small{font-size:13px;color:var(--muted);font-weight:400}
.calc{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}
.calc-in{display:grid;gap:12px;align-content:start}
.fld{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.fld select,.fld input{font:inherit;font-size:15px;color:var(--text);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 10px;border-radius:10px;font-size:13.5px}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.tg{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.tg input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.tg small{color:var(--muted);font-size:12px}
.calc-out{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.calc-out .lbl{font-size:13px;color:var(--muted)}
.calc-out .sum{font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.calc-out ul{list-style:none;font-size:13.5px;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.calc-out li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.calc-out li b{color:var(--text);white-space:nowrap}
.calc-out small{font-size:12px;color:#8a90a3;margin-top:auto}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.qk{display:flex;flex-direction:column;gap:2px;padding:16px 18px;text-decoration:none;color:var(--text);text-align:left;font-size:15px}
.qk span{font-size:13px;color:var(--muted)}
.qk:hover{border-color:#c7d3fb}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lk{display:flex;flex-direction:column;padding:13px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);background:#fff;font-size:14.5px}
.lk span{font-size:12.5px;color:var(--muted)}
.lk:hover{border-color:#c7d3fb;background:#fafbff}
:focus-visible{outline:3px solid rgba(63,110,245,.45);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:8px;z-index:99}
.skip:focus{left:12px}
@media (max-width:720px){.calc,.quick,.links{grid-template-columns:1fr}}

.biz{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding:16px 18px;border-radius:14px;border:1px solid #dfe3fb;background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft))}
.biz p{font-size:13.5px;color:var(--muted);margin-top:2px}
.biz-btn{display:flex;gap:8px;flex-wrap:wrap}
.biz-btn .btn{font-size:13.5px;padding:9px 14px}
.quick{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.quick{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.quick{grid-template-columns:1fr}}

.biz-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--muted);padding:12px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.biz-meta b{color:var(--text)}
.tabs button small{opacity:.7;font-size:11.5px;margin-left:2px}
.bcount{font-size:14px;color:var(--muted);margin:6px 0 10px}
.bcount b{color:var(--blue)}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bhead b{font-size:16px}
.bbiz{font-size:13.5px;color:var(--text)}
.baddr{font-size:13px;color:var(--muted)}
.bmap{display:flex;gap:12px;font-size:13px;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.bmap a{text-decoration:none}

@media (max-width:520px){
  .ci{height:20px}
  .brand{gap:8px;font-size:14.5px;line-height:1.3}
  .brand small{font-size:11px}
  .top-call{padding:6px 10px;font-size:13px;white-space:nowrap}
}
.top-call{white-space:nowrap}
@media (max-width:380px){.brand small{display:none}}

.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.card .ico{margin:-6px 0 6px -6px;height:84px}
.sign{width:84px;height:84px;display:block;filter:drop-shadow(0 6px 10px rgba(63,110,245,.18));transition:transform .3s}
.card:hover .sign{transform:translateY(-3px) scale(1.04)}
.ic{width:1.05em;height:1.05em;vertical-align:-.16em;flex-shrink:0}
.h2i{width:26px;height:26px;color:var(--blue);margin-right:8px;vertical-align:-4px}
.panel h2{display:flex;align-items:center;gap:10px}
.panel h2 .sign{width:52px;height:52px;filter:none}
.cta .h2i{width:22px;height:22px}
.qk b .ic,.biz b .ic,.h3 .ic{color:var(--blue)}
.btn.primary .ic{color:#fff}
.biz-meta .ic,.baddr .ic{color:var(--blue)}

.cta h2{display:flex;align-items:center;gap:10px}
.cta h2 .sign{width:44px;height:44px;flex-shrink:0}

/* 7. 푸터 — 카피라이트 고정 */
footer{border-top:1px solid var(--line);background:#fff;padding:26px 0;text-align:center;font-size:13px;color:var(--muted)}
footer .upd{font-size:12px;color:#9aa0b2;margin-top:6px}
@media (max-width:720px){
  .std,.contact{grid-template-columns:1fr}
  .panel{padding:22px 18px}
  .cta{flex-direction:column;align-items:flex-start}
  .top-call span{display:none}
}

/* 8. 글자 배치 — 단어 중간 줄바꿈 방지·자간 */
body{word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.02em}
h1,h2,h3,.hero p,.cta p,.card p,.qk span{text-wrap:balance}
p,li,.a,summary{text-wrap:pretty}
.br-m{display:none}
@media (max-width:520px){
  .br-m{display:inline}
  main{padding:22px 0 44px}
  .hero{padding:14px 0 22px}
  .hero h1{font-size:28px;letter-spacing:-.04em;line-height:1.3}
  .hero p{font-size:15px;line-height:1.55;letter-spacing:-.03em}
  .chip{font-size:13px}
  .search input{font-size:15px}
  .cta{padding:18px;gap:14px}
  .cta h2{font-size:17px;letter-spacing:-.04em;line-height:1.35}
  .cta h2 .sign{width:38px;height:38px}
  .cta p{font-size:14px;margin-top:6px;letter-spacing:-.03em}
  .cta .btn{width:100%;justify-content:center}
  .cards{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
  .card .ico{margin:0;height:60px;flex-shrink:0}
  .card .sign{width:60px;height:60px}
  .card .tx{flex:1;min-width:0}
  .card h3{font-size:16px;letter-spacing:-.03em;margin-bottom:2px;line-height:1.35}
  .card p{font-size:13px;line-height:1.45;letter-spacing:-.03em}
  .quick{grid-template-columns:1fr 1fr;gap:10px}
  .qk{padding:13px 14px;font-size:14px;letter-spacing:-.04em;line-height:1.35}
  .qk b{display:flex;align-items:center;gap:6px}
  .qk span{font-size:12px;line-height:1.4;margin-top:4px}
  .panel h2{font-size:21px;letter-spacing:-.04em;line-height:1.3;gap:8px}
  .panel h2 .sign{width:40px;height:40px;flex-shrink:0}
  .lead{font-size:14.5px;letter-spacing:-.03em;line-height:1.6}
  .faq summary{letter-spacing:-.03em}
  .contact .v{font-size:19px;letter-spacing:-.04em}
}

/* 9. AI 활용 표시 */
.ai-badge{display:inline-flex;align-items:center;gap:8px;margin:14px auto 0;padding:5px 12px 5px 5px;border-radius:999px;background:#fff;border:1px solid #dfe3fb;text-decoration:none;color:var(--muted);font-size:13px;box-shadow:0 2px 8px rgba(63,110,245,.08);transition:.2s;max-width:100%}
.ai-badge:hover{border-color:#c7d3fb;color:var(--text)}
.ai-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.ai-tag .ic{width:13px;height:13px}
.ai-tag.lg{font-size:13px;padding:5px 12px;margin-bottom:10px}
.ai-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-go{width:14px;height:14px;color:#a3a9bd;flex-shrink:0}
.hero .search{margin-top:18px}
.ft-ai{color:var(--blue);text-decoration:none;font-weight:500}
.ai-hero{text-align:left;margin-bottom:6px}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ai-box{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:#fff}
.ai-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:8px}
.ai-h .ic{color:var(--blue);width:20px;height:20px}
.ai-box ul{list-style:none;display:grid;gap:6px;font-size:14px;color:var(--text)}
.ai-box li{position:relative;padding-left:14px;line-height:1.55}
.ai-box li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--purple)}
.ai-box small{display:block;margin-top:10px;font-size:12px;color:#8a90a3}
.ai-call{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding:18px 20px;border-radius:14px;border:1px solid #dfe3fb;background:linear-gradient(135deg,var(--blue-soft),var(--purple-soft))}
.ai-call p{font-size:13.5px;color:var(--muted);margin-top:2px}
.ai-call .btn{white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ai-law{margin-top:16px;font-size:12.5px;color:#8a90a3;line-height:1.6}
@media (max-width:720px){.ai-grid{grid-template-columns:1fr}.ai-call{flex-direction:column;align-items:stretch}.ai-call .btn{justify-content:center}}
@media (max-width:520px){.ai-badge{font-size:12.5px;gap:6px}.ai-box{padding:16px}.ai-box ul{font-size:13.5px}.ai-h{font-size:15px}}

.cta2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.cta2 .cta{margin:0;flex-direction:column;align-items:flex-start}
.cta2 .cta .btn{margin-top:auto}
@media (max-width:820px){.cta2{grid-template-columns:1fr;gap:10px}}
.vg-step{display:flex;align-items:center;gap:10px;margin:24px 0 10px;font-size:16px}
.vg-step span{width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.vg-types .opt.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 2px rgba(63,110,245,.15)}
.vg-reg,.vg-pre{margin-bottom:8px}
.vg-help{font-size:13px;color:var(--muted);line-height:1.6}
.vg-sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;margin-top:14px;align-items:start}
.vg-in{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.vg-unit{position:relative;display:block}
.vg-unit input{padding-right:38px}
.vg-unit i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted)}
.vg-chk{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.vg-chk input{width:18px;height:18px}
.vg-out{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px}
.vg-pics{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.vg-pics figure{flex:1;min-width:0;text-align:center}
.vg-pics figure.side{flex:0 0 30%}
.vg-pics svg{width:100%;height:auto;display:block}
.vg-pics figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.vg-empty{padding:40px 16px;text-align:center;color:var(--warn);font-size:14px}
.vg-legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.vg-legend li{display:flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block;flex-shrink:0}
.lg.g{background:#e3f6ee;border:1.5px dashed #14a36b}.lg.b{background:#3f6ef5}.lg.r{background:repeating-linear-gradient(45deg,#d43b3b 0 3px,#fde3e3 3px 6px)}
.vg-result{margin-top:18px;padding:18px}.vg-result .big{font-size:20px;line-height:1.35}
.vg-result.p{background:#fff3f3;border-color:#f3c4c4}.vg-result.p .big{color:#b02020}
.vg-cond{font-size:14px;color:var(--text);padding:12px 16px;border-radius:12px;background:var(--soft);border:1px solid var(--line);margin-bottom:12px}
.vg-rows{list-style:none;display:grid;gap:8px}
.vg-row{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;border-left-width:4px}
.vg-row.ok{border-left-color:#14a36b}.vg-row.bad{border-left-color:#d43b3b;background:#fff8f8}.vg-row.need{border-left-color:#d9930d;background:#fffbf2}.vg-row.info{border-left-color:#c7d3fb}
.vg-row b{font-size:14.5px}.vg-row p{font-size:14px;line-height:1.55}.vg-row em{font-style:normal;color:var(--muted);font-size:13px}
.vg-badge{flex-shrink:0;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;margin-top:1px}
.vg-badge.ok{background:var(--ok-soft);color:#0c7a4e}.vg-badge.bad{background:#fde3e3;color:#b02020}.vg-badge.need{background:var(--warn-soft);color:#8a5200}.vg-badge.info{background:var(--blue-soft);color:#2c4aa8}
.vg-exc{font-size:13px!important;color:var(--muted)}
.vg-src{display:block;font-size:12px;color:#8a90a3;margin-top:4px}
.vg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.h3 small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.vg-search input{font:inherit;font-size:15px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.vg-hist{margin-top:20px;border:1px solid var(--line);border-radius:12px;padding:0 16px;background:#fff}
.vg-hist summary{padding:13px 0;cursor:pointer;font-weight:500;font-size:14.5px}
.vg-hist .a{padding-bottom:14px;font-size:14px;display:grid;gap:10px}
.vg-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.vg-tbl th,.vg-tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.vg-tbl th{background:var(--soft);font-weight:700}
@media (max-width:820px){.vg-sim{grid-template-columns:1fr}.vg-out{order:-1;position:sticky;top:68px;z-index:5;box-shadow:0 6px 18px rgba(20,24,40,.08)}.vg-pics svg{max-height:34vh}}

}

/* ---------- 화면 전환(주소의 #이름으로 이동) ---------- */
function route(){
  const id = (location.hash || "#home").slice(1);
  const idx = MENUS.findIndex(m => m.id === id);
  if (id === "ai") renderAI(); else if (idx < 0) renderHome(); else renderSection(idx);
  window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("hashchange", route);
function go(id){ location.hash = id; }

    {k:"h5",   t:"간판 윗부분까지의 높이가 지면으로부터 5m 이상입니까?", if:a=>!a.sign},

  ],

  show:[{k:"first", t:"처음으로 표시하는 공연간판입니까?"}],
  banner:[{k:"fac30", t:"현수막을 걸기 위한 게시시설(틀)을 새로 설치하고, 그 면적이 30㎡를 초과합니까?"}]
};

function judge(t,a){
  const P={c:"p",big:"허가 대상",msg:"허가를 받은 뒤 설치해야 합니다."};
  const S={c:"s",big:"신고 대상",msg:"신고를 마친 뒤 설치해야 합니다."};
  switch(t){
    case "wall":
      if(a.len10) return {...P, why:"한 변의 길이가 10m 이상인 벽면 이용 간판", law:"시행령 제4조"};
      if(a.floor4 && a.other) return {...P, why:"4층 이상 층에 표시하는 타사광고 벽면 이용 간판", law:"시행령 제4조"};
      if(a.floor4) return {...S, why:"건물 4층 이상 층에 표시하는 벽면 이용 간판", law:"시행령 제5조제1항제1호"};
      if(a.area5 && !a.door) return {...S, why:"면적 5㎡ 이상인 벽면 이용 간판", law:"시행령 제5조제1항제1호"};
      if(a.neon) return {c:"c",big:"확인 필요",msg:"네온류·전광류·디지털 디스플레이를 사용하는 간판은 크기가 작아도 허가·신고 대상일 수 있습니다.",why:"조명·디지털 광고물 사용",law:"담당 부서 확인"};
      return {c:"x",big:"허가·신고 제외",msg:"허가·신고 없이 표시할 수 있으나, 표시방법(위치·크기·수량 등)은 지켜야 합니다.",why:"3층 이하에 표시하는 면적 5㎡ 미만 간판(또는 출입구 양옆 세로 간판)",law:"시행령 제5조제1항제1호 반대해석"};
    case "proj":
      if(a.sign) return {...S, why:"의료기관·약국 또는 이용·미용업소 표지등", law:"시행령 제5조제1항제4호"};
      if(a.h5 && a.a1) return {...P, why:"높이 5m 이상이고 한 면 면적 1㎡ 이상인 돌출간판", law:"시행령 제4조제1항제2호"};
      return {...S, why:a.h5?"한 면의 면적이 1㎡ 미만인 돌출간판":"윗부분 높이가 5m 미만인 돌출간판", law:"시행령 제5조제1항제4호"};
    case "pole": return a.h4 ? {...P, why:"높이 4m 이상인 지주 이용 간판", law:"시행령 제4조"} : {...S, why:"높이 4m 미만인 지주 이용 간판", law:"시행령 제5조제1항제5호"};
    case "roof": return {...P, why:"모든 옥상간판", law:"시행령 제4조"};
    case "stand":return {...S, why:"모든 입간판", law:"시행령 제5조제1항제5호의2"};
    case "banner":return a.fac30 ? {...P, why:"면적 30㎡를 초과하는 현수막 게시시설", law:"시행령 제5조제2항 단서"} : {...S, why:"현수막(가로등 현수기 포함)", law:"시행령 제5조제1항제6호"};
    case "show": return a.first ? {...P, why:"최초로 표시하는 공연간판", law:"시행령 제4조"} : {...S, why:"최초 표시가 아닌 공연간판", law:"시행령 제5조제1항제3호"};
    case "balloon":return {...P, why:"모든 애드벌룬", law:"시행령 제4조"};
    case "paper":return {...S, why:"벽보·전단", law:"시행령 제5조"};
    default: return {c:"c",big:"확인 필요",msg:"창문 이용 광고물, 디지털 광고물 등은 형태에 따라 기준이 달라 담당 부서 상담이 필요합니다.",why:"그 밖의 광고물",law:"담당 부서 확인"};
  }
}

const wiz = {step:0,type:null,ans:{}};
function drawDiagnose(el){
  const qs = (QUESTIONS[wiz.type]||[]).filter(q=>!q.if||q.if(wiz.ans));
  const total = 3, pct = [15,55,100][wiz.step];
  let body = "";
  if(wiz.step===0){
    body = `<h3 style="margin-bottom:12px">1단계 · 설치하려는 광고물 종류를 고르세요</h3>
      <div class="opts">${TYPES.map(t=>`<button class="opt ${wiz.type===t.k?'sel':''}" data-t="${t.k}"><b>${t.n}</b><span>${t.d}</span></button>`).join("")}</div>`;
  } else if(wiz.step===1){
    const name = TYPES.find(t=>t.k===wiz.type).n;
    body = `<h3 style="margin-bottom:14px">2단계 · ${name}의 크기와 위치를 알려주세요</h3>` +
      (qs.length ? qs.map(q=>`<div class="q"><p>${q.t}</p><div class="yn">
        <button class="opt ${wiz.ans[q.k]===true?'sel':''}" data-q="${q.k}" data-v="1"><b>예</b></button>
        <button class="opt ${wiz.ans[q.k]===false?'sel':''}" data-q="${q.k}" data-v="0"><b>아니요</b></button></div></div>`).join("")
        : `<p class="lead">이 광고물은 크기와 관계없이 기준이 정해져 있습니다. '결과 보기'를 눌러 주십시오.</p>`);
  } else {
    const r = judge(wiz.type, wiz.ans);
    const docs = r.c==="p"||r.c==="s";
    body = `<h3 style="margin-bottom:14px">3단계 · 진단 결과</h3>
      <div class="result ${r.c}">
        <div style="color:var(--muted);font-size:14px">${TYPES.find(t=>t.k===wiz.type).n}</div>
        <div class="big">${r.big}</div>
        <div>${r.msg}</div>
        <ul><li>판단 이유: ${r.why}</li><li>근거: 「옥외광고물법」 ${r.law}</li>
        <li>도시지역, 도로·철도 주변 등 법 제3조의 지역에 표시하는 경우를 기준으로 합니다.</li></ul>
      </div>
      ${docs?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="docState.mode='${r.c==='p'?'permit':'report'}';go('documents')">→ 다음: ${r.big} 구비서류 확인</button><button class="btn" onclick="calc.k='${({wall:wiz.ans.other?'wallHo':'wallH',proj:'proj',pole:'pole',roof:'roof',stand:'stand',banner:wiz.ans.fac30?'bfac':'banner',show:'show',balloon:'balloon',paper:'poster'})[wiz.type]||'wallH'}';go('fees')">${ic("calculator")} 수수료 계산해 보기</button></div>`:
      `<button class="btn primary" onclick="go('contact')">→ 담당 부서에 문의하기</button>`}
      <div class="note warn">자가진단은 참고용입니다. 지역·건물 여건, 심의 대상 여부에 따라 결과가 달라질 수 있으니 설치 전 반드시 담당 부서(${CONTACT.tel})와 상담하시기 바랍니다.</div>
      ${bizBox("허가·신고 신청과 간판 설치는 등록된 옥외광고사업자에게 의뢰하면 서류 준비부터 도움을 받을 수 있습니다.")}`;
  }
  const ready = wiz.step===0 ? !!wiz.type : wiz.step===1 ? qs.every(q=>typeof wiz.ans[q.k]==="boolean") : true;
  el.innerHTML = `<h2>${sign("compass")}허가·신고 대상 자가진단</h2>
    <p class="lead">세 단계로 내 광고물이 허가 대상인지 신고 대상인지 확인합니다.</p>
    <div class="wiz-bar"><i style="width:${pct}%"></i></div>
    <div class="wiz-label">${wiz.step+1} / ${total} 단계</div>
    ${body}
    <div class="pager" style="margin-top:20px">
      <button class="btn" id="wb" ${wiz.step===0?"disabled":""}>이전 질문</button>
      ${wiz.step<2?`<button class="btn primary" id="wn" ${ready?"":"disabled"}>${wiz.step===1?"결과 보기":"다음 질문"}</button>`
        :`<button class="btn" id="wr">처음부터 다시</button>`}
    </div>`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ if(wiz.type!==b.dataset.t){wiz.ans={};} wiz.type=b.dataset.t; drawDiagnose(el); });
  el.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ wiz.ans[b.dataset.q]=b.dataset.v==="1"; drawDiagnose(el); });
  const wb=el.querySelector("#wb"), wn=el.querySelector("#wn"), wr=el.querySelector("#wr");
  if(wb) wb.onclick=()=>{wiz.step--;drawDiagnose(el);};
  if(wn) wn.onclick=()=>{wiz.step++;drawDiagnose(el);};
  if(wr) wr.onclick=()=>{wiz.step=0;wiz.type=null;wiz.ans={};drawDiagnose(el);};
}

/* 수수료 계산식 — 남양주시 수수료 계산식(엑셀)과 같은 방식
   초과 면적의 1㎡ 미만 단수는 1㎡로 올리고, 결과는 100원 미만을 버립니다. */
const calc = { k:"wallH", w:"", h:"", sides:1, qty:1, neon:false, kind:"new", safety:false };
function feeOf(rule, area){
  if(rule.mode==="count") return rule.base;
  const over = Math.max(0, area - rule.upTo);
  return rule.base + Math.ceil(over - 1e-9) * rule.add;
}
function safetyOf(key, area){
  const s = SAFETY_RULES[key]; if(!s) return null;
  if(s.min && area < s.min) return {fee:0, note:`면적 ${s.min}㎡ 미만은 안전점검 대상이 아닙니다.`};
  let base;
  if(s.t1!==null && area<=s.t1) base=s.f1;
  else if(area<=s.t2) base=s.f2;
  else base=s.f2 + Math.ceil(area - s.t2 - 1e-9)*s.add;
  return {base, fee: Math.floor(base*1.1/100)*100};
}
function calcResult(){
  const r = FEE_RULES.find(x=>x.k===calc.k);
  const w=parseFloat(calc.w)||0, hh=parseFloat(calc.h)||0;
  const sides = r.sides ? calc.sides : 1;
  const area = Math.round(w*hh*sides*100)/100;
  const qty = Math.max(1, parseInt(calc.qty)||1);
  const needSize = r.mode==="area";
  let lines=[], total=0, ok = !needSize || area>0;
  if(ok){
    let fee = feeOf(r, area) * qty;
    lines.push([`기본 수수료${needSize?` (면적 ${area}㎡)`:""}${qty>1?` × ${qty}${r.qty||r.unit||"개"}`:""}`, fee]);
    if(calc.neon){ lines.push(["네온류·전광류 사용(2배)", fee]); fee*=2; }
    if(calc.kind==="content"){ const half=Math.floor(fee/2/100)*100; lines.push(["광고 내용만 변경(2분의 1)", half-fee]); fee=half; }
    fee = Math.floor(fee/100)*100; total+=fee;
    if(calc.safety && r.safety){
      const s = safetyOf(r.safety, needSize?area:0);
      if(s && s.fee){ lines.push([`안전점검 수수료(별표 4 ${won(s.base)} + 10% 가산)`, s.fee]); total+=s.fee; }
      else if(s) lines.push([s.note, 0]);
    }
  }
  return `<div class="lbl">예상 수수료</div>
    <div class="sum">${ok?won(total):"—"}</div>
    ${ok?`<ul>${lines.map(([t,v])=>`<li><span>${t}</span><b>${v<0?"−"+won(-v):(v?won(v):"")}</b></li>`).join("")}</ul>`:`<p style="font-size:14px;color:var(--muted)">가로·세로 길이(m)를 입력하십시오.</p>`}
    <small>조례 별표 3·4 기준 참고 금액이며, 실제 납부액은 접수 시 산정한 고지 금액에 따릅니다.</small>`;
}
function drawFeeCalc(box){
  const r = FEE_RULES.find(x=>x.k===calc.k);
  const groups = [...new Set(FEE_RULES.map(x=>x.g))];
  const needSize = r.mode==="area";
  box.innerHTML = `
    <div class="calc">
      <div class="calc-in">
        <label class="fld"><span>광고물 종류</span>
          <select id="c-k">${groups.map(g=>`<optgroup label="${g}">${FEE_RULES.filter(x=>x.g===g).map(x=>`<option value="${x.k}" ${x.k===calc.k?"selected":""}>${x.n}</option>`).join("")}</optgroup>`).join("")}</select></label>
        ${needSize?`<div class="row2">
          <label class="fld"><span>가로(m)</span><input id="c-w" type="number" inputmode="decimal" min="0" step="0.01" value="${calc.w}" placeholder="예) 5.8"></label>
          <label class="fld"><span>세로(m)</span><input id="c-h" type="number" inputmode="decimal" min="0" step="0.01" value="${calc.h}" placeholder="예) 1.5"></label></div>`:""}
        ${r.sides?`<div class="fld"><span>표시 면</span><div class="seg">
          <button data-s="1" class="${calc.sides==1?'on':''}">한 면</button><button data-s="2" class="${calc.sides==2?'on':''}">양면</button></div></div>`:""}
        ${(r.mode==="count"||r.qty)?`<label class="fld"><span>수량(${r.qty||r.unit})</span><input id="c-q" type="number" min="1" step="1" value="${calc.qty}"></label>`:""}
        <div class="fld"><span>신청 구분</span><div class="seg">
          <button data-kind="new" class="${calc.kind==='new'?'on':''}">신규·연장·규격 변경</button><button data-kind="content" class="${calc.kind==='content'?'on':''}">광고 내용만 변경</button></div></div>
        <label class="tg"><input type="checkbox" id="c-n" ${calc.neon?"checked":""}> 네온류·전광류 사용 <small>(단순 조명·광원 비노출은 제외, 점멸·동영상은 포함)</small></label>
        ${r.safety?`<label class="tg"><input type="checkbox" id="c-s" ${calc.safety?"checked":""}> 안전점검 대상 광고물 <small>(${SAFETY_RULES[r.safety].target})</small></label>`:""}
      </div>
      <div class="calc-out" id="c-out" aria-live="polite">${calcResult()}</div>
    </div>`;
  const re = ()=>drawFeeCalc(box);
  const out = ()=>{ box.querySelector("#c-out").innerHTML = calcResult(); };
  box.querySelector("#c-k").onchange=e=>{calc.k=e.target.value;calc.safety=false;calc.qty=1;re();};
  [["#c-w","w"],["#c-h","h"],["#c-q","qty"]].forEach(([id,key])=>{const i=box.querySelector(id); if(i) i.oninput=e=>{calc[key]=e.target.value; out();};});
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{calc.sides=+b.dataset.s;re();});
  box.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{calc.kind=b.dataset.kind;re();});
  box.querySelector("#c-n").onchange=e=>{calc.neon=e.target.checked;out();};
  const s=box.querySelector("#c-s"); if(s) s.onchange=e=>{calc.safety=e.target.checked;out();};
}
function feeText(r){
  if(r.mode==="count") return `${r.unit}당 <b>${won(r.base)}</b>`;
  return `${r.upTo}㎡ 이하 <b>${won(r.base)}</b><br><small>초과 시 1㎡마다 ${won(r.add)}</small>`;
}

  drawFeeCalc(el.querySelector("#calcBox"));

  ["수수료는 얼마인가요?","광고물 종류와 면적에 따라 다릅니다. 예를 들어 자사 가로형 간판은 6㎡ 이하 3,000원, 돌출간판은 연면적 6㎡ 이하 15,000원입니다. '수수료 안내'의 계산기로 미리 확인해 보십시오."],

  ["신청을 취소하면 수수료를 돌려받을 수 있나요?","허가·신고를 수리하기 전에 신청을 변경하거나 철회한 경우, 과오납한 경우 등에는 수수료를 반환받을 수 있습니다. (남양주시 조례 제25조제2항)"],
  ["작은 간판도 허가나 신고를 해야 하나요?","3층 이하에 표시하는 면적 5㎡ 미만 벽면 이용 간판은 허가·신고 대상이 아닙니다. 다만 표시방법(위치·크기·수량 등)은 지켜야 하고, 네온류·전광류 등을 쓰는 경우에는 대상이 될 수 있으니 문의해 주십시오."],
  ["내 건물(사유지)에 설치하는 간판도 신고해야 하나요?","네. 사유지에 설치하는 광고물도 종류와 규모에 따라 허가·신고 절차를 거쳐야 합니다."],
  ["허가·신고 없이 간판을 달면 어떻게 되나요?","시정 명령(제거 등)을 받을 수 있으며, 이행하지 않으면 과태료 또는 이행강제금이 부과될 수 있습니다. 반드시 허가(신고) 후 설치하십시오."],
  ["간판을 몇 개까지 달 수 있나요?","한 업소에서 표시할 수 있는 간판 총수량은 시행령과 조례로 제한됩니다. 구체적인 수량 기준은 건물 위치(곡각지점 등)에 따라 다르므로 상담이 필요합니다."],
  ["간판 허가(신고)는 언제까지 유효한가요?","간판의 표시기간은 원칙적으로 3년 이내입니다. 계속 사용하려면 만료일 전후 30일 이내에 기간 연장을 신청해야 합니다."],

  ["현수막은 아무 곳에나 걸 수 있나요?","현수막은 원칙적으로 지정 게시대에 신고 후 게시해야 합니다. 가로수·전봇대 등에 무단으로 거는 현수막은 정비 대상이며 과태료가 부과될 수 있습니다."],

  ["등록된 간판(옥외광고) 업체는 어디서 확인하나요?",`이 페이지의 <a href="#biz">등록 광고업체 찾기</a> 메뉴에서 업소명·지역·영업내용으로 바로 검색할 수 있습니다. 남양주시 누리집 「사전행정정보」에 공개되는 <a href="${LINKS.bizNow}" target="_blank" rel="noopener">옥외광고업 현황</a>을 매일 확인해 자동으로 갱신합니다.`],
  ["간판 제작·설치 업체도 따로 갖춰야 할 것이 있나요?","옥외광고사업자는 옥외광고사업 등록을 해야 하며, 2021년 6월 9일부터 옥외광고물 손해배상 책임보험(또는 같은 내용이 포함된 보험) 가입이 의무화되었습니다. 위반 시 과태료가 부과될 수 있습니다."]
];
function drawFaq(el){
  el.innerHTML = `<h2>${sign("message-circle-question")}자주 묻는 질문</h2>
    <p class="lead">질문을 누르면 답변이 열립니다.</p>
    <div class="faq">${FAQ.map(([q,a],i)=>`<details ${i===0?"open":""}><summary>${q}</summary><div class="a">${a}</div></details>`).join("")}</div>`;
}

/* =========================================================
   아. 문의처
   ========================================================= */
function drawContact(el){
  el.innerHTML = `<h2>${sign("phone")}문의처</h2>
    <p class="lead">옥외광고물 허가·신고 상담은 아래로 연락해 주십시오.</p>
    <div class="contact">
      <div class="box"><small>담당 기관</small><div class="v">${CONTACT.office}</div><small>${CONTACT.dept} · ${CONTACT.area}</small></div>
      <div class="box"><small>전화번호</small><div class="v">${CONTACT.tel}</div>
        <button class="btn copy" id="cp">번호 복사</button> <a class="btn copy" style="text-decoration:none;display:inline-block" href="tel:${CONTACT.tel.replace(/-/g,"")}">전화 걸기</a></div>
      <div class="box"><small>상담 시간</small><div class="v" style="font-size:16px">${CONTACT.hours}</div></div>
      <div class="box"><small>방문 전 준비</small><div class="v" style="font-size:16px">자가진단 결과 · 설치 위치 사진 · 간판 도안</div></div>
    </div>
    <div class="note">방문 상담 시 미리 연락 주시면 더 정확하게 안내해 드릴 수 있습니다.</div>
    <h3 class="h3">${ic("link")} 공식 자료 바로가기</h3>
    <div class="links">
      ${[["정부24 옥외광고물 표시 허가·신고 신청",LINKS.gov24,"온라인 신청"],
         ["남양주시 민원편람 · 신청서 서식",LINKS.forms,"별지 제1호서식, 작성예시, 안전점검 수수료"],
         ["옥외광고물법",LINKS.law,"국가법령정보센터"],
         ["옥외광고물법 시행령",LINKS.decree,"허가·신고 대상(제4조·제5조)"],
         ["경기도 옥외광고물 조례",LINKS.gg,"표시방법 세부 기준"],
         ["남양주시 옥외광고물 조례",LINKS.nyj,"수수료(별표 3·4), 과태료 기준"],
         ["남양주시 옥외광고업 현황 (등록 업체)",LINKS.bizNow,`${BIZ.asof} 기준 · ${BIZ.dept}`],
         ["옥외광고업 현황 전체 목록",LINKS.bizList,"연도별 공개 자료"],
         ["공공데이터포털 · 남양주시 옥외광고업 현황",LINKS.bizData,"엑셀 내려받기"],
         ["남양주시 특정구역 지정 고시",LINKS.zone,"특정구역·정비시범구역"],
         ["남양주시 현수막 지정게시대 현황",LINKS.banner,"게시대 위치"],
         ["찾기쉬운 생활법령 · 옥외광고물",LINKS.easylaw,"법제처 생활법령"],
         ["월간 팝사인(업계 소식)",LINKS.popsign,"옥외광고 업계 동향·제도 변경 기사"]]
        .map(([t,u,d])=>`<a class="lk" href="${u}" target="_blank" rel="noopener"><b>${t}</b><span>${d}</span></a>`).join("")}
    </div>`;
  el.querySelector("#cp").onclick = async e => {
    try{ await navigator.clipboard.writeText(CONTACT.tel); e.target.textContent="복사했습니다"; }
    catch{ e.target.textContent=CONTACT.tel; }
  };
}

const SECTIONS = {
  diagnose:drawDiagnose, standards:drawStandards, documents:drawDocuments,
  visual:(el)=>drawVisual(el), process:drawProcess, fees:drawFees, biz:drawBiz, faq:drawFaq, contact:drawContact
};
route();
</script>
