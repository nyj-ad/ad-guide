name: 옥외광고업 현황 자동 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-biz
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install xlrd openpyxl

      - name: 남양주시 게시판 확인 및 변환
        run: python scripts/update_biz.py

      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet -- data/biz.json; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/biz.json
            git commit -m "옥외광고업 현황 자동 갱신 ($(jq -r .asof data/biz.json) 기준)"
            git push
          fi
